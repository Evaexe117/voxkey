[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "voxkey"
version = "0.1.0"
description = "Push-to-talk dictation for Linux, transcribed locally"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [{ name = "Evaexe117" }]
keywords = ["dictation", "speech-to-text", "whisper", "push-to-talk", "linux"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]
dependencies = [
    "faster-whisper",
    "sounddevice",
    "numpy",
    "evdev",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-cov", "ruff", "mypy"]

[project.scripts]
voxkey = "voxkey.cli:main"

[project.urls]
Homepage = "https://github.com/Evaexe117/voxkey"
Issues = "https://github.com/Evaexe117/voxkey/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/voxkey"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "PTH", "RET", "SIM", "ARG"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests", "tools"]

[[tool.mypy.overrides]]
module = ["sounddevice", "evdev", "faster_whisper", "ctranslate2"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
